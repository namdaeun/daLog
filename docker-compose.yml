services:
  postgres:
    image: postgres:16-alpine
    container_name: diary-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: diary
      POSTGRES_PASSWORD: diary
      POSTGRES_DB: diary
    ports:
      - '5432:5432'
    volumes:
      - diary-pg-data:/var/lib/postgresql/data

volumes:
  diary-pg-data:
